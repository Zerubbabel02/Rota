ext {
    // Matches the kotlin-gradle-plugin classpath already declared in the
    // root build.gradle — plugins that check hasProperty('kotlin_version')
    // (e.g. @capacitor/local-notifications) fall back to their own,
    // different pinned version otherwise, forcing a redundant download.
    kotlin_version = '2.0.20'
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}